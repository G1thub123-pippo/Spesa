<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#5e3b1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spesa">
<title>Spesa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cabin+Sketch:wght@700&display=swap">
<style>
/* layout: lavagne in cornice di legno su parete, colonna singola; tema unico voluto */
:root{--wall:#3a2e25;--wood:#8a5a32;--woodd:#5e3b1e;--board:#2c3e33;--chalk:#f1efe6;--dim:#b9c2b8;--yel:#f3dd7a;--pink:#f2a7a7;--ui:system-ui,-apple-system,sans-serif;--hand:'Caveat','Comic Sans MS',cursive;--title:'Cabin Sketch','Caveat',cursive;color-scheme:dark}
html,body{margin:0}body{min-height:100vh;background:var(--wall);color:var(--chalk);font-family:var(--ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--woodd)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;background:var(--woodd);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{flex:1;margin:0;font:700 26px var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;color:var(--chalk);border:1px solid var(--dim);border-radius:8px;padding:5px 10px;font-size:14px}
main{max-width:620px;margin:auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.board{background:var(--board);border:10px solid var(--wood);border-radius:6px;box-shadow:inset 0 0 40px rgba(0,0,0,.45);padding:14px 16px 18px;position:relative}
.board.tile{display:block;width:100%;text-align:left;color:var(--chalk)}
.board.tile::after{content:"";position:absolute;left:18%;right:18%;bottom:-10px;height:6px;background:var(--woodd);border-radius:3px}
.bt{display:flex;align-items:baseline;gap:10px}
.bt h2{flex:1;margin:0;font:700 28px/1.1 var(--title);text-wrap:balance}
.tally{font:700 26px var(--hand);color:var(--yel);font-variant-numeric:tabular-nums}
.peek{margin:6px 0 0;font:500 21px/1.25 var(--hand);color:var(--dim);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.add{display:grid;grid-template-columns:minmax(0,1fr) 76px 48px;gap:8px}
.add input,.nl input{min-width:0;padding:10px 12px;border:1px dashed var(--dim);border-radius:8px;background:transparent;color:var(--chalk);font:500 22px var(--hand)}
.add input::placeholder,.nl input::placeholder{color:#8d988c}
.nl{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px}
.chk{background:var(--chalk);color:var(--board);border:0;border-radius:8px;font-size:22px;font-weight:700}
ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
li{display:flex;align-items:center;border-bottom:1px dashed rgba(241,239,230,.18);transition:opacity .35s}
li label{flex:1;display:flex;align-items:center;gap:12px;padding:8px 2px;font:500 25px/1.15 var(--hand);min-width:0}
li label span{flex:1;min-width:0;overflow-wrap:anywhere}
li input{appearance:none;width:22px;height:22px;flex-shrink:0;border:2px solid var(--chalk);border-radius:4px;display:grid;place-content:center}
li input:checked::after{content:"✓";font:700 22px var(--hand);color:var(--yel)}
.q{font:700 22px var(--hand);color:var(--yel);white-space:nowrap}
li.ok{opacity:.32}li.ok label span{text-decoration:line-through}
.x{background:none;border:0;color:var(--dim);font-size:18px;padding:6px 10px}
.sep{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font:500 20px var(--hand);color:var(--dim)}
.lk{background:none;border:0;color:var(--pink);font:500 20px var(--hand)}
.mu{font:500 23px var(--hand);color:var(--dim);text-align:center;margin:14px 0 4px}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.bar button{flex:1;background:transparent;color:var(--chalk);border:1px solid var(--dim);border-radius:8px;padding:9px;font-size:14px}
textarea{width:100%;min-height:150px;box-sizing:border-box;font:13px ui-monospace,monospace;background:var(--board);color:var(--chalk);border:1px solid var(--dim);border-radius:8px;padding:10px}
.msg{font-size:13px;color:var(--dim);margin:0}
@media (prefers-reduced-motion:reduce){li{transition:none}}
#upd{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--yel);color:var(--board);padding:8px max(16px,env(safe-area-inset-left,0px));font-size:14px}
#upd button{background:var(--board);color:var(--chalk);border:0;border-radius:8px;padding:5px 10px}
#dot{width:9px;height:9px;border-radius:50%;background:#777;flex-shrink:0}
.ver{font-size:11px;color:var(--dim)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><button id="bk" hidden aria-label="Indietro">←</button><h1 id="tt">Spesa</h1><span class="ver">v1.0.2</span><span id="dot" title="Connessione"></span><button id="del" hidden>Elimina lista</button></header>
<div id="upd" hidden><span id="updt">Nuova versione disponibile</span><button onclick="aggiornaApp()">Aggiorna</button></div>
<main id="m"><p class="mu">Caricamento…</p></main>

<script type="module">
const APP_VERSION='1.0.2';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
const app=initializeApp({
  apiKey:"AIzaSyD44NW4GAqepOvB_XfNKWzaTxrOt3spyRc",
  authDomain:"bilancio-casa-981f2.firebaseapp.com",
  projectId:"bilancio-casa-981f2",
  storageBucket:"bilancio-casa-981f2.firebasestorage.app",
  messagingSenderId:"960581445744",
  appId:"1:960581445744:web:04ca0e66261bed31e52cb5"
});
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const COL='spesa';
let liste=[],voci=[],cur=null,conf=false,pronto=false;
const $=id=>document.getElementById(id),m=$('m');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ts=()=>Date.now(),nid=p=>p+ts().toString(36)+Math.random().toString(36).slice(2,6);
const L=()=>liste.find(l=>l.id===cur),VL=id=>voci.filter(v=>v.lista===id);
const fq=q=>q?(/^\d+([.,]\d+)?$/.test(q)?'×'+q:q):'';
const dot=s=>{$('dot').style.background={ok:'#7bd389',err:'#e05252'}[s]||'#777';};
const w=p=>p.then(()=>dot('ok')).catch(()=>dot('err'));

onSnapshot(collection(db,COL),{includeMetadataChanges:true},s=>{
  liste=[];voci=[];
  s.forEach(d=>{const x={id:d.id,...d.data()};if(x.tipo==='lista')liste.push(x);else if(x.tipo==='voce')voci.push(x);});
  liste.sort((a,b)=>a.ts-b.ts);pronto=true;
  dot(s.metadata.fromCache&&!navigator.onLine?'err':'ok');r();
},()=>dot('err'));

function rHome(){
  let h=`<form class="nl" id="fl"><input id="nl" placeholder="Nuova lavagna (es. Mercato)" aria-label="Nome nuova lista"><button class="chk" aria-label="Crea lista">＋</button></form>`;
  h+=liste.map(l=>{const da=VL(l.id).filter(v=>!v.fatto).sort((a,b)=>a.ts-b.ts);return `<button class="board tile" data-id="${l.id}"><div class="bt"><h2>${esc(l.nome)}</h2><span class="tally">${da.length}</span></div><p class="peek">${da.length?da.map(v=>esc(v.testo)).join(' · '):'tutto preso ✓'}</p></button>`}).join('')||(pronto?'<p class="mu">Crea la prima lavagna</p>':'<p class="mu">Caricamento…</p>');
  return h;
}
function li(v){return `<li class="${v.fatto?'ok':''}"><label><input type="checkbox" data-v="${v.id}" ${v.fatto?'checked':''}><span>${esc(v.testo)}</span>${v.qta?`<b class="q">${esc(fq(v.qta))}</b>`:''}</label><button class="x" data-r="${v.id}" aria-label="Elimina">✕</button></li>`;}
function rLista(l){
  const all=VL(l.id),da=all.filter(v=>!v.fatto).sort((a,b)=>a.ts-b.ts),fa=all.filter(v=>v.fatto).sort((a,b)=>b.ts-a.ts);
  let h=`<div class="board"><form class="add" id="fv"><input id="nv" placeholder="Cosa manca?" autocomplete="off" aria-label="Voce"><input id="nq" placeholder="q.tà" autocomplete="off" aria-label="Quantità (facoltativa)"><button class="chk" aria-label="Aggiungi">＋</button></form>`;
  h+=`<ul>${da.map(li).join('')}</ul>`+(da.length?'':'<p class="mu">Non manca niente</p>');
  if(fa.length)h+=`<div class="sep"><span>Presi (${fa.length})</span><button class="lk" id="sv">cancella</button></div><ul>${fa.map(li).join('')}</ul>`;
  h+='</div>';
  if(conf)h+=`<div class="bar"><button id="cy" style="color:var(--pink)">Sì, elimina "${esc(l.nome)}"</button><button id="cn">Annulla</button></div>`;
  return h;
}
function r(){
  const a=document.activeElement,fid=a&&a.id,nv=$('nv')?.value,nq=$('nq')?.value,nl=$('nl')?.value;
  const l=L();if(cur&&pronto&&!l){cur=null;conf=false;}
  $('bk').hidden=$('del').hidden=!cur;
  $('tt').textContent=cur&&l?l.nome:'Spesa';
  m.innerHTML=cur&&l?rLista(l):rHome();
  if($('nv')&&nv)$('nv').value=nv; if($('nq')&&nq)$('nq').value=nq; if($('nl')&&nl)$('nl').value=nl;
  if(fid&&$(fid))$(fid).focus();
}
$('bk').onclick=()=>{cur=null;conf=false;r();};
$('del').onclick=()=>{conf=true;r();};
m.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='fl'){const n=$('nl').value.trim();if(!n)return;$('nl').value='';w(setDoc(doc(db,COL,nid('l_')),{tipo:'lista',nome:n,ts:ts()}));}
  if(e.target.id==='fv'){const t=$('nv').value.trim(),q=$('nq').value.trim();if(!t)return;$('nv').value='';$('nq').value='';
    const es=VL(cur).find(v=>v.testo.toLowerCase()===t.toLowerCase());
    if(es)w(updateDoc(doc(db,COL,es.id),{fatto:false,ts:ts(),...(q?{qta:q}:{})}));
    else w(setDoc(doc(db,COL,nid('v_')),{tipo:'voce',lista:cur,testo:t,qta:q,fatto:false,ts:ts()}));
    $('nv').focus();}
});
m.addEventListener('change',e=>{const id=e.target.dataset.v;if(!id)return;const f=e.target.checked;
  e.target.closest('li').classList.toggle('ok',f);
  setTimeout(()=>w(updateDoc(doc(db,COL,id),{fatto:f,ts:ts()})),300);});
m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.id){cur=b.dataset.id;conf=false;r();scrollTo(0,0);return;}
  if(b.dataset.r){w(deleteDoc(doc(db,COL,b.dataset.r)));return;}
  if(b.id==='sv'){const bt=writeBatch(db);VL(cur).filter(v=>v.fatto).forEach(v=>bt.delete(doc(db,COL,v.id)));w(bt.commit());return;}
  if(b.id==='cy'){const bt=writeBatch(db);VL(cur).forEach(v=>bt.delete(doc(db,COL,v.id)));bt.delete(doc(db,COL,cur));cur=null;conf=false;w(bt.commit());r();return;}
  if(b.id==='cn'){conf=false;r();}
});

window.aggiornaApp=async()=>{
  try{for(const x of await navigator.serviceWorker.getRegistrations())await x.unregister();for(const k of await caches.keys())await caches.delete(k);}catch(e){}
  location.reload();
};
fetch('./version.json?t='+Date.now()).then(x=>x.json()).then(j=>{if(j.version&&j.version!==APP_VERSION){$('updt').textContent='Versione '+j.version+' disponibile (hai '+APP_VERSION+')';$('upd').hidden=false;}}).catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
r();
</script>
</body>
</html>
